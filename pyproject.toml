[project]
name = "am-i-available"
version = "0.1.0"
description = "Am I Available web application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40.30",
    "fastapi[standard]",
    "google>=3.0.0",
    "google-api-python-client>=2.181.0",
    "google-auth>=2.40.3",
    "google-auth-oauthlib>=1.2.2",
    "PyJWT>=2.8.0",
    "mangum>=0.19.0",
    "openai>=1.84.0",
    "pydantic>=2.11.5",
    "pydantic-settings>=2.9.1",
    "sqlalchemy>=2.0.41",
    "supabase>=2.15.2",
    "tenacity>=8.2.0",
    "uvicorn[standard]",
    "autogen-agentchat>=0.7.4",
    "autogen-ext[openai]>=0.7.4",
]

[project.scripts]
dev-api = "uvicorn api.main:app --reload --host 0.0.0.0 --port 8000"

[dependency-groups]
dev = [
    "black>=25.1.0",
]

[tool.pyrefly]
search-path = ["."]
python-version = "3.12"

